<!DOCTYPE html>
<html>
<head>
	<title>Image Slider</title>
	<style type="text/css">
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body{
			position: relative;
			width: 100%;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			justify-content: flex-start;
			align-items: center;
			padding-top: 26px;
			overflow-x: hidden;
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #ffebf0 0%, #f9d9ff 30%, #d8f4ff 70%, #fff4c2 100%);
		}
		.balloon {
			position: absolute;
			bottom: -220px;
			width: 80px;
			height: 100px;
			border-radius: 50% 50% 48% 48%;
			background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.1));
			box-shadow: inset -8px -8px 18px rgba(255,255,255,0.35), inset 8px 8px 18px rgba(255,255,255,0.2), 0 0 12px rgba(255,255,255,0.25);
			animation: floatBalloon linear infinite;
		}
		.balloon::before {
			content: "";
			position: absolute;
			left: 50%;
			bottom: -70px;
			transform: translateX(-50%);
			width: 2px;
			height: 70px;
			background: rgba(95, 62, 91, 0.5);
		}
		.balloon::after {
			content: "";
			position: absolute;
			left: 50%;
			bottom: -12px;
			transform: translateX(-50%);
			width: 10px;
			height: 10px;
			border-radius: 50%;
			background: rgba(255,255,255,0.7);
		}
		@keyframes floatBalloon {
			0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0.8; }
			50% { transform: translateY(-55vh) scale(1.08) rotate(2deg); opacity: 1; }
			100% { transform: translateY(-110vh) scale(1) rotate(-2deg); opacity: 0.85; }
		}
		.title-birthday {
			position: relative;
			top: 0;
			left: 0;
			transform: none;
			text-align: center;
			z-index: 5;
			color: #8b1e5d;
			text-shadow: 0 4px 12px rgba(255,255,255,0.7);
			pointer-events: none;
			margin-bottom: 18px;
		}
		.title-birthday h1 {
			font-size: clamp(2rem, 4vw, 4rem);
			letter-spacing: 2px;
			font-weight: 700;
		}
		.title-birthday p {
			font-size: clamp(1rem, 2vw, 1.5rem);
			letter-spacing: 1px;
			margin-top: 5px;
			font-weight: 600;
		}
		.music-toggle {
			position: fixed;
			top: 18px;
			right: 18px;
			z-index: 20;
			padding: 10px 16px;
			border: none;
			border-radius: 999px;
			background: linear-gradient(135deg, #ff4d88, #ff8a5b);
			color: #fff;
			font-size: 0.95rem;
			font-weight: 700;
			letter-spacing: 0.04em;
			box-shadow: 0 8px 20px rgba(255, 80, 120, 0.35);
			cursor: pointer;
		}
		.music-toggle:active {
			transform: scale(0.98);
		}
		.confetti-layer {
			position: fixed;
			inset: 0;
			pointer-events: none;
			overflow: hidden;
			z-index: 15;
		}
		.confetti-piece {
			position: absolute;
			top: -20px;
			width: 10px;
			height: 18px;
			border-radius: 3px;
			opacity: 0.9;
			box-shadow: 0 0 8px rgba(255,255,255,0.55);
			animation: confetti-fall linear forwards;
		}
		.confetti-piece.star {
			clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
			height: 12px;
			width: 12px;
		}
		@keyframes confetti-fall {
			0% {
				transform: translate3d(0, 0, 0) rotate(0deg) scale(0.8);
				opacity: 0;
			}
			12% { opacity: 1; }
			40% {
				transform: translate3d(calc(var(--drift) * 0.3), 38vh, 0) rotate(180deg) scale(1.05);
			}
			100% {
				transform: translate3d(var(--drift), 110vh, 0) rotate(620deg) scale(0.85);
				opacity: 0;
			}
		}
		.slide-container{
			position: relative;
			width: min(95vw, 1100px);
			height: 420px;
			max-width: 100%;
			margin-top: 0;
			border: 3px solid #ede6d6;
			box-shadow: 0 0 8px 2px rgba(0,0,0,0.2);
			transition: width 0.3s ease, height 0.3s ease;
		}
		.slide-container .slides{
			width: 100%;
			height: calc(100% - 40px);
			position: relative;
			overflow: hidden;
		}
		.slide-container .slides img{
			width: 100%;
			height: 100%;
			position: absolute;
			object-fit: contain;
			background: #f4f1eb;
		}
		.slide-container .slides img.active {
			left: 0;
		}
		.slide-container .slides img:not(.active){
			top: 0;
			left: -100%;
		}
		span.next, span.prev{
			position: absolute;
			top: 50%;
			transform: translateY(-50%);
			padding: 14px;
			color: #eee;
			font-size: 24px;
			font-weight: bold;
			transition: 0.5s;
			border-radius: 3px;
			user-select: none;
			cursor: pointer;
			z-index: 1;
		}
		span.next{
			right: 20px;
		}
		span.prev{
			left: 20px;
		}
		span.next:hover, span.prev:hover{
			background-color: #ede6d6;
			opacity: 0.8;
			color: #222;
		} 
		.dotsContainer{
			position: absolute;
			bottom: 5px;
			z-index: 3;
			left: 50%;
			transform: translateX(-50%);
		}
		.dotsContainer .dot{
			width: 15px;
			height: 15px;
			margin: 0px 2px;
			border: 3px solid #bbb;
			border-radius: 50%;
			display: inline-block;
			cursor: pointer;
			transition: background-color 0.6s ease;
		}
		.dotsContainer .active{
			background-color: #555;
		}

		@keyframes next1{
			from{
				left: 0%
			}
			to{
				left: -100%;
			}
		}
		@keyframes next2{
			from{
				left: 100%
			}
			to{
				left: 0%;
			}
		}

		@keyframes prev1{
			from{
				left: 0%
			}
			to{
				left: 100%;
			}
		}
		@keyframes prev2{
			from{
				left: -100%
			}
			to{
				left: 0%;
			}
		}

		@media (max-width: 768px) {
			body {
				padding-top: 20px;
			}

			.title-birthday {
				margin-bottom: 14px;
			}

			.slide-container {
				height: 300px;
			}
		}

		@media (max-width: 480px) {
			body {
				padding-top: 18px;
			}

			.music-toggle {
				top: 12px;
				right: 12px;
				padding: 9px 12px;
				font-size: 0.8rem;
			}

			.title-birthday h1 {
				font-size: clamp(1.7rem, 8vw, 2.5rem);
			}

			.title-birthday p {
				font-size: clamp(0.9rem, 3.5vw, 1.1rem);
			}

			.slide-container {
				height: 230px;
			}
		}

	</style>
</head>
<body>

<button class="music-toggle" id="musicToggle" type="button" aria-label="Play or pause birthday music">Play Song</button>
<audio id="birthdayAudio" loop preload="auto" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>
<div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

<div class="title-birthday">
	<h1>Happy Birthday</h1>
	<p>May your day be full of joy and surprises!</p>
</div>

<div class="balloon" style="left: 8%; background: linear-gradient(135deg, #ff8ab5, #ffb6d5); animation-duration: 12s; animation-delay: 0s;"></div>
<div class="balloon" style="left: 22%; background: linear-gradient(135deg, #ffd166, #ffe39a); animation-duration: 15s; animation-delay: 2s;"></div>
<div class="balloon" style="left: 38%; background: linear-gradient(135deg, #7bdff2, #b6efff); animation-duration: 13s; animation-delay: 1s;"></div>
<div class="balloon" style="left: 58%; background: linear-gradient(135deg, #b8f2a1, #d7ffd4); animation-duration: 16s; animation-delay: 3s;"></div>
<div class="balloon" style="left: 74%; background: linear-gradient(135deg, #b197fc, #d7cbff); animation-duration: 14s; animation-delay: 1.5s;"></div>
<div class="balloon" style="left: 90%; background: linear-gradient(135deg, #ff9f6e, #ffc4a3); animation-duration: 17s; animation-delay: 2.5s;"></div>

<div class="slide-container">
	
	<div class="slides">
		<img src="image-1.jpg" class="active">
		<img src="image-2.jpg">
		<img src="image-3.jpg">
		<img src="image-4.jpg">
		<img src="image-5.jpg">
		<img src="image-6.jpg">
		<img src="image-7.jpg">
		<img src="image-8.jpg">
		<img src="image-9.jpg">
	</div>

	<div class="buttons">
		<span class="next">&#10095;</span>
		<span class="prev">&#10094;</span>
	</div>

	<div class="dotsContainer"></div>

</div>

<script type="text/javascript">
	
	const musicToggle = document.getElementById('musicToggle');
	const birthdayAudio = document.getElementById('birthdayAudio');
	const confettiLayer = document.getElementById('confettiLayer');
	const colors = ['#ff4d88', '#ffd166', '#7bdff2', '#7df9a1', '#b197fc', '#ff9f6e', '#ffffff'];
	let isSongPlaying = false;

	function createConfettiBurst() {
		for (let i = 0; i < 60; i++) {
			const piece = document.createElement('span');
			piece.className = `confetti-piece ${Math.random() > 0.7 ? 'star' : ''}`;
			piece.style.left = `${Math.random() * 100}%`;
			piece.style.background = colors[Math.floor(Math.random() * colors.length)];
			piece.style.setProperty('--drift', `${(Math.random() - 0.5) * 260}px`);
			piece.style.animationDuration = `${3.4 + Math.random() * 2.3}s`;
			piece.style.animationDelay = `${Math.random() * 0.2}s`;
			confettiLayer.appendChild(piece);
			setTimeout(() => piece.remove(), 6000);
		}
	}

	async function toggleBirthdaySong() {
		if (!birthdayAudio) return;

		if (!isSongPlaying) {
			isSongPlaying = true;
			musicToggle.textContent = 'Playing';
			try {
				await birthdayAudio.play();
			} catch (error) {
				console.warn('Audio playback was blocked by the browser:', error);
				isSongPlaying = false;
				musicToggle.textContent = 'Play Song';
			}
		} else {
			isSongPlaying = false;
			musicToggle.textContent = 'Play Song';
			birthdayAudio.pause();
			birthdayAudio.currentTime = 0;
		}
	}

	musicToggle.addEventListener('click', toggleBirthdaySong);
	createConfettiBurst();
	setInterval(createConfettiBurst, 2200);

	const slideImages = document.querySelectorAll('.slides img');
	const next = document.querySelector('.next');
	const prev = document.querySelector('.prev');
	const dotsContainer = document.querySelector('.dotsContainer');
	const container = document.querySelector('.slide-container');
	let counter = 0;
	let autoSlideTimer = null;

	slideImages.forEach((image, index) => {
		image.classList.toggle('active', index === 0);
		image.style.left = index === 0 ? '0%' : '-100%';
		image.style.animation = 'none';

		const dot = document.createElement('div');
		dot.className = `dot ${index === 0 ? 'active' : ''}`;
		dot.setAttribute('attr', String(index));
		dot.addEventListener('click', () => switchImage(dot));
		dotsContainer.appendChild(dot);
	});

	const dots = document.querySelectorAll('.dot');

	function indicators() {
		dots.forEach((dot, index) => {
			dot.classList.toggle('active', index === counter);
		});
	}

	function setContainerSize(image) {
		if (!image) return;

		const ratio = image.naturalWidth / image.naturalHeight;
		const maxWidth = window.innerWidth * 0.9;
		const maxHeight = window.innerHeight * 0.7;
		let width = maxWidth;
		let height = width / ratio;

		if (height > maxHeight) {
			height = maxHeight;
			width = height * ratio;
		}

		container.style.width = `${Math.min(width, 1100)}px`;
		container.style.height = `${Math.min(height, 700)}px`;
	}

	function updateSlide(newIndex, direction) {
		const currentImage = slideImages[counter];
		if (!currentImage) return;

		currentImage.classList.remove('active');
		currentImage.style.animation = direction === 'next' ? 'next1 0.5s ease-in forwards' : 'prev1 0.5s ease-in forwards';
		currentImage.style.left = '0%';

		counter = (newIndex + slideImages.length) % slideImages.length;
		const nextImage = slideImages[counter];
		if (nextImage) {
			nextImage.classList.add('active');
			nextImage.style.animation = direction === 'next' ? 'next2 0.5s ease-in forwards' : 'prev2 0.5s ease-in forwards';
			nextImage.style.left = '0%';
			setContainerSize(nextImage);
		}

		indicators();
	}

	next.addEventListener('click', () => {
		updateSlide(counter + 1, 'next');
		startAutoSliding();
	});

	prev.addEventListener('click', () => {
		updateSlide(counter - 1, 'prev');
		startAutoSliding();
	});

	function startAutoSliding() {
		clearInterval(autoSlideTimer);
		autoSlideTimer = setInterval(() => {
			updateSlide(counter + 1, 'next');
		}, 3000);
	}

	setContainerSize(slideImages[0]);
	startAutoSliding();

	container.addEventListener('mouseenter', () => {
		clearInterval(autoSlideTimer);
	});

	container.addEventListener('mouseleave', () => {
		startAutoSliding();
	});

	window.addEventListener('resize', () => {
		setContainerSize(slideImages[counter]);
	});

	function switchImage(currentImage) {
		const imageId = Number(currentImage.getAttribute('attr'));
		if (Number.isNaN(imageId) || imageId === counter) {
			return;
		}

		const direction = imageId > counter ? 'next' : 'prev';
		updateSlide(imageId, direction);
		startAutoSliding();
	}

</script>
</body>
</html>
